name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml

  version:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - id: version
        run: echo "version=$(python scripts/release_version.py)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest }
    runs-on: ${{ matrix.os }}
    env:
      DONUT_RELEASE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'linux-musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke-test the executable outside the source checkout
        shell: bash
        run: |
          bin="$GITHUB_WORKSPACE/target/${{ matrix.target }}/release"
          mkdir "$RUNNER_TEMP/donut-project" && cd "$RUNNER_TEMP/donut-project"
          "$bin/donut" --help
          test "$("$bin/donut" -v | tr -d '\r')" = "donut $DONUT_RELEASE_VERSION"
          "$bin/donut" init
          test -f .donut/skills/swim-lane-worker/SKILL.md
          test -f skills/donut-planner/SKILL.md
          ls .donut/*/to_do/.gitkeep  # init makes the first session's tickets folder
      - name: Pack
        shell: bash
        run: |
          mkdir -p dist/donut
          cd "target/${{ matrix.target }}/release"
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            cp donut.exe qwen-build-next.exe "$GITHUB_WORKSPACE/dist/donut/"
            cd "$GITHUB_WORKSPACE/dist" && 7z a "donut-${{ matrix.target }}.zip" donut >/dev/null
          else
            cp donut qwen-build-next "$GITHUB_WORKSPACE/dist/donut/"
            cd "$GITHUB_WORKSPACE/dist" && tar -czf "donut-${{ matrix.target }}.tar.gz" donut
          fi
          rm -rf donut
      - uses: actions/upload-artifact@v4
        with:
          name: donut-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: donut-*
          path: dist/
          merge-multiple: true
      - name: Create SHA-256 checksums
        run: cd dist && sha256sum donut-* > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: v${{ needs.version.outputs.version }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --target "$RELEASE_SHA" --generate-notes --title "Donut $RELEASE_TAG"
          fi
